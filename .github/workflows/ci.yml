name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Advisory only: surfaces high/critical advisories without failing the
      # build if the registry endpoint is temporarily unavailable.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck:server
      - run: npm test
      - run: npm run build
      - run: npm run e2e
