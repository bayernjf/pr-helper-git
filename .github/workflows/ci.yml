name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Advisory only: surfaces high/critical advisories without failing the
      # build if the registry endpoint is temporarily unavailable.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm test
      - run: npm run build
